<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example 1</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <my-custom-element></my-custom-element>
    <div id=target></div>
    <span -- itemprop></span>
    <script type=module>
        import '/MyCustomElement/MyCustomElement.js';
        import '/emc.js';
    </script>
    <script>
        function runTest(){
            const mce = document.querySelector('my-custom-element');
            mce.shadowRoot.querySelector('input').dispatchEvent(new Event('change'));
            setTimeout(() => {
                if(mce.shadowRoot.querySelector('div').textContent === 'message heard.'){
                    target.setAttribute('mark', 'good');
                }
            }, 500);
            
        }
        setTimeout(() => {
            runTest();
        }, 2000);
    </script>
</body>
</html>
