<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example 1</title>
    <!-- #include virtual="/imports.html" -->

    <script type=module>
        import 'be-hive/be-hive.js';
        import '/MyCustomElement/MyCustomElement.js';
    </script>
</head>
<body>
    <be-hive>
        <script type=emc-parser 
                src="be-hive/parsers/parse-pattern-statements.js" 
                parser-name=parse-pattern-statements></script>
        <script type=emc 
                src="be-dispatching/emc.json" 
                wait-for-parsers=parse-pattern-statements></script>
    </be-hive>
    <my-custom-element></my-custom-element>
    <div id=target></div>
    <script>
        function runTest(){
            const mce = document.querySelector('my-custom-element');
            mce.shadowRoot.querySelector('input').dispatchEvent(new Event('change'));
            setTimeout(() => {
                if(mce.shadowRoot.querySelector('div').textContent === 'message heard.'){
                    target.setAttribute('mark', 'good');
                }
            }, 500);
        }
        setTimeout(() => {
            runTest();
        }, 2000);
    </script>
</body>
</html>
