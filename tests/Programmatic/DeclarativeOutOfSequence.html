<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmatic declarative out of sequence</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <div id=container>
        <input id=input>
    </div>
    <output id=log></output>
    <div id=target></div>
    <script type=module>
        import {defBeDispatching} from '/def.js';
        // show which events reach the container
        container.addEventListener('my-event', () => log.value += 'my-event heard. ');
        container.addEventListener('change', () => log.value += 'change heard. ');
        // set before the config is registered -- the spawn is deferred until defBeDispatching runs.
        input.enh.set.beDispatching.dispatchRules = [
            {dispatch: 'my-event', dispatchOn: 'change', bubbles: true}
        ];
        await defBeDispatching(document.body);

        setTimeout(() => {
            input.dispatchEvent(new Event('change', {bubbles: true}));
            setTimeout(() => {
                if(log.value === 'change heard. my-event heard. ' || log.value === 'my-event heard. change heard. ') target.setAttribute('mark', 'good');
            }, 200);
        }, 1000);
    </script>
</body>
</html>
