<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmatic declarative in sequence</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <div id=container>
        <input id=input>
    </div>
    <output id=log></output>
    <script type=module>
        import {defBeDispatching} from '/def.js';
        // show which events reach the container
        container.addEventListener('my-event', () => log.value += 'my-event heard. ');
        container.addEventListener('change', () => log.value += 'change heard. ');
        await defBeDispatching(document.body);
        // equivalent to <input be-dispatching="of bubbling event my-event on change">
        input.enh.set.beDispatching.dispatchRules = [
            {dispatch: 'my-event', dispatchOn: 'change', bubbles: true}
        ];
    </script>
</body>
</html>
